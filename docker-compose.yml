x-llama-common: &llama-common
  # JetPack 7.2 (L4T 39.2 / CUDA 13.2.1 / Ubuntu 24.04) 专用构建
  # 使用本地 Dockerfile 基于 NVIDIA NGC cuda:13.2.1-runtime-ubuntu24.04
  # llama-server 二进制及共享库通过 volume 挂载从宿主机 /usr/local 注入容器
  #
  # 注意: 挂载目标路径使用 /opt/llama 而不是 /usr/local 的原因:
  #   NVIDIA CDI hook (nvidia-cdi-hook cudacompat) 在容器初始化时会扫描标准库
  #   路径（/usr/local/lib 等）寻找 CUDA 库做前向兼容性检测，解析
  #   libggml-cuda.so 的 ELF 头时会触发 toolkit 自身的 bug（panic: slice
  #   bounds out of range）。挂载到 /opt/llama 非标准路径可避开扫描。
  build:
    context: .
    dockerfile: Dockerfile
  runtime: nvidia
  devices:
    - nvidia.com/gpu=all
  network_mode: host
  restart: unless-stopped
  volumes:
    - /mnt/ssd/huggingface:/root/.cache/huggingface
    # 将宿主机编译安装的 llama-server 二进制和共享库挂载到非标准路径
    # 避开 NVIDIA CDI hook 对 /usr/local/lib 的 CUDA ELF 扫描 (panic bug)
    # 宿主机更新 llama.cpp 并重新安装后，只需: docker compose restart
    - /usr/local/bin:/opt/llama/bin:ro
    - /usr/local/lib:/opt/llama/lib:ro
  environment:
    - HF_ENDPOINT=https://hf-mirror.com
    # 显式启用 GPU 设备及其所有能力
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    # Jetson UMA 统一内存优化: 允许运行时统一调度 CPU/GPU 内存，
    # 社区实测可带来约 10~15% 的推理性能提升
    - GGML_CUDA_ENABLE_UNIFIED_MEMORY=1
    # 让容器能找到挂载到 /opt/llama 的二进制 and 共享库
    - PATH=/opt/llama/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    # 由于禁用了 update-ldcache 挂钩，必须手动将 NVIDIA 驱动相关路径加入链接器搜索路径
    # 宿主机使用 nvgpu 驱动，因此仅保留 nvgpu 排除 openrm 避免驱动冲突
    - LD_LIBRARY_PATH=/opt/llama/lib:/usr/lib/aarch64-linux-gnu/nvidia:/opt/nvidia/l4t-gpu-libs/nvgpu
  ulimits:
    memlock:
      soft: -1
      hard: -1

# stable-diffusion.cpp (sd-server) 公共配置 —— 与 x-llama-common 的差异:
#   sd.cpp 携带自己 fork 的 ggml，与 llama.cpp 安装在 /usr/local 的 ggml 库
#   同名不兼容，因此编译安装到独立前缀 /opt/sdcpp（静态链接，仅挂载 bin）。
#   GPU 运行时、host 网络、模型目录等与 llama 服务保持一致。
x-sd-common: &sd-common
  build:
    context: .
    dockerfile: Dockerfile
  runtime: nvidia
  devices:
    - nvidia.com/gpu=all
  network_mode: host
  restart: unless-stopped
  volumes:
    - /mnt/ssd/huggingface:/root/.cache/huggingface
    - /opt/sdcpp/bin:/opt/sdcpp/bin:ro
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    # Jetson UMA 统一内存优化（同 llama 服务）
    - GGML_CUDA_ENABLE_UNIFIED_MEMORY=1
    - PATH=/opt/sdcpp/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    # sd.cpp 静态链接，仅需 NVIDIA 驱动库路径（update-ldcache 挂钩已禁用）
    - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/nvidia:/opt/nvidia/l4t-gpu-libs/nvgpu
  ulimits:
    memlock:
      soft: -1
      hard: -1

services:
  gemma4-31b:
    <<: *llama-common
    container_name: gemma4-31b
    # [2026-10-09 精简] 本地模型文件已删除（质量型 dense 档与 qwen38-27b 重叠）。
    # 部署配置保留，恢复方式:
    #   python3 scripts/update-models.py gemma4-31b && docker compose up -d gemma4-31b
    command: >
      llama-server
      -m /root/.cache/huggingface/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
      --host 0.0.0.0
      --port 8080
      -ngl 999
      -c 65536
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q4_0
      -t 8
      --batch-size 512
      --ubatch-size 256
      --load-mode mlock
      --jinja
      --cache-ram 8192
      --swa-checkpoints 4
      --n-predict 8192
      --repeat-penalty 1.1

  gemma4-26b-a4b:
    <<: *llama-common
    container_name: gemma4-26b-a4b
    # [2026-10-09 精简] 本地模型文件（含 MTP draft）已删除（快速 MoE 档与
    # qwen36-35b-moe 重叠）。部署配置保留，恢复方式:
    #   python3 scripts/update-models.py gemma4-26b-a4b && docker compose up -d gemma4-26b-a4b
    command: >
      llama-server
      -m /root/.cache/huggingface/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      --model-draft /root/.cache/huggingface/MTP/mtp-gemma-4-26B-A4B-it-Q8_0.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --parallel 1
      --host 0.0.0.0
      --port 8081
      -ngl 999
      -c 65536
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q4_0
      -t 8
      --batch-size 512
      --ubatch-size 256
      --load-mode mlock
      --jinja
      --cache-ram 8192
      --swa-checkpoints 4
      --n-predict 8192
      --repeat-penalty 1.1

  gemma4-12b-agentic:
    <<: *llama-common
    container_name: gemma4-12b-agentic
    command: >
      llama-server
      -m /root/.cache/huggingface/gemma4-v2-Q6_K.gguf
      --host 0.0.0.0
      --port 8082
      -ngl 999
      -c 65536
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q4_0
      -t 8
      --batch-size 512
      --ubatch-size 256
      --load-mode mlock
      --jinja
      --cache-ram 8192
      --swa-checkpoints 4
      --n-predict 8192
      --repeat-penalty 1.1

  qwen36-35b-moe:
    <<: *llama-common
    container_name: qwen36-35b-moe
    # 官方原版 Qwen3.6-35B-A3B (Unsloth UD-Q4_K_M GGUF)。
    # 相比社区蒸馏版 (Qwopus3.6-...) 更稳定，为 Qwen 官方 post-train 产物，
    # 同样具备 agentic coding + thinking preservation 能力，原生 262K 上下文。
    # 架构 qwen3_5_moe (Gated DeltaNet + Gated Attention + 256 experts)，
    # 已被当前 llama.cpp (含 LLM_ARCH_QWEN35MOE) 支持。
    command: >
      llama-server
      -m /root/.cache/huggingface/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8084
      -ngl 999
      -c 131072
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q4_0
      -t 8
      --batch-size 512
      --ubatch-size 256
      --load-mode mlock
      --jinja
      --cache-ram 8192
      --swa-checkpoints 4
      --n-predict 8192
      --repeat-penalty 1.1
      --reasoning-preserve

  qwen38-27b:
    <<: *llama-common
    container_name: qwen38-27b
    # Qwen 官方原版 Qwen3.8-27B (Unsloth Dynamic V3.0 UD-Q4_K_XL GGUF) - 全参数 dense 模型。
    # 与 35B-A3B (MoE,仅激活 3B) 互补：27B 为全参数激活，每 token 计算量更大、
    # 但对单点推理质量（尤其非 agentic 的通用任务）更扎实稳定。
    # 架构 qwen3_5 (Gated DeltaNet + Gated Attention 混合层, 64 层 dense)，
    # 已被当前 llama.cpp (含 LLM_ARCH_QWEN35) 支持。原生 262K 上下文。
    command: >
      llama-server
      -m /root/.cache/huggingface/Qwen3.8-27B-UD-Q4_K_XL.gguf
      --model-draft /root/.cache/huggingface/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --parallel 1
      --host 0.0.0.0
      --port 8085
      -ngl 999
      -c 262144
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q4_0
      -t 8
      --batch-size 512
      --ubatch-size 256
      --load-mode mlock
      --jinja
      --cache-ram 8192
      --swa-checkpoints 4
      --n-predict 8192
      --temperature 1.0
      --top-p 0.95
      --repeat-penalty 1.0
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --reasoning-preserve

  qwen-image:
    <<: *sd-common
    container_name: qwen-image
    # Qwen-Image-2.1 统一文生图 + 图片编辑，引擎为 stable-diffusion.cpp (sd-server)。
    # 四个组件: 扩散模型 Q4_K_M GGUF + 2.1 专用 VAE (不兼容旧版 Qwen-Image/Wan VAE)
    # + Qwen3-VL-8B 文本编码器 + mmproj 视觉投影 (图片编辑/参考图输入必需)。
    # --sage-attn: SageAttention INT8 注意力 kernel (sm_87 走 SM80+ 兼容路径)，
    # 实测比 --diffusion-fa 采样快约 10%，不支持的层自动回退 FA。
    # 内存: 权重合计约 10.4 GiB (含 VAE/mmproj) + 采样期前缀缓存，
    # 与 LLM 服务共存时注意 64GB 统一内存上限，不要同时全部启动。
    # API: http://<ip>:8083/ 为入口；OpenAI 风格 /v1/images/*，
    #      A1111 兼容 /sdapi/v1/*，原生异步 /sdcpp/v1/*。
    command: >
      sd-server
      --diffusion-model /root/.cache/huggingface/qwen-image-2.1-Q4_K_M.gguf
      --vae /root/.cache/huggingface/vae/qwen_image_2.1_vae_bf16.safetensors
      --llm /root/.cache/huggingface/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
      --llm_vision /root/.cache/huggingface/mmproj-BF16.gguf
      --listen-ip 0.0.0.0
      --listen-port 8083
      --cfg-scale 6.0
      --sage-attn
